name: Build

# Проверочная сборка на всех платформах. Каждая платформа — независимая job без
# `needs` между ними, поэтому GitHub Actions запускает их параллельно, и падение
# одной job не отменяет и не блокирует остальные (это поведение по умолчанию для
# job-графа без зависимостей — им не нужен strategy.fail-fast, он относится
# только к matrix-стратегиям).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"
  DOTNET_VERSION: "10.0.x"

jobs:
  analyze:
    name: Analyze & fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # widget_test и dart_io_core_test — чистый Dart, без внешних артефактов.
      - run: flutter test test/widget_test.dart test/dart_io_core_test.dart

  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: flutter pub get
      - run: dotnet build native/Comics.slnx -c Release
      - name: Publish headless core (win-x64)
        shell: bash
        run: tool/build_headless.sh win-x64
      - run: flutter build windows --release
      - name: Test
        shell: bash
        run: flutter test test/widget_test.dart test/dart_io_core_test.dart test/core_client_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
          retention-days: 14

  build-macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: flutter pub get
      - run: dotnet build native/Comics.slnx -c Release
      # NativeAOT-dylib нужен ffi_core_test (AOT-ворота для мобильного FFI-транспорта,
      # см. flows/sdd-comics-editor-v2.9-android-ios) — macOS host используется как
      # прогон для этой проверки, т.к. NativeAOT не кросс-компилируется между ОС.
      - run: tool/build_native.sh osx
      - run: flutter build macos --release
      - name: Embed headless core into the built app
        run: tool/build_headless.sh
      # Все 4 test-suite: widget, dart_io_core, core_client (process), ffi_core (AOT-ворота).
      - run: flutter test
      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent comics_editor.app comics_editor-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/comics_editor-macos.zip
          retention-days: 14

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: flutter pub get
      # Только Comics.Editor.Headless: Linux desktop не использует WPF/Windows-only
      # проекты решения, незачем собирать их и расширять поверхность отказа.
      - run: dotnet build native/Comics.Editor.Headless/Comics.Editor.Headless.csproj -c Release
      - run: flutter build linux --release
      - name: Embed headless core into the built bundle
        run: tool/build_headless.sh
      - run: flutter test test/widget_test.dart test/dart_io_core_test.dart test/core_client_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/*/release/bundle/
          retention-days: 14

  build-android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      # Android не использует .NET/NativeAOT-ядро: CoreCLR NativeAOT (ILCompiler)
      # не поддерживает linux-bionic/android RID в .NET 10 (исключены явно в
      # Microsoft.NETCoreSdk.BundledVersions.props — не вопрос кросс-компиляции
      # или NDK). Open/save реализованы на чистом Dart (DartIoCore), как и на iOS —
      # см. flows/sdd-comics-editor-v2.9-android-ios/04-implementation-log.md.
      - run: flutter build apk --release
      - run: flutter test test/widget_test.dart test/dart_io_core_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  build-ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # iOS не использует .NET/NativeAOT-ядро: open/save реализованы на чистом Dart
      # (DartIoCore) — см. flows/sdd-comics-editor-v2.9-android-ios/01-requirements.md, Q1.
      - run: flutter build ios --release --no-codesign
      - run: flutter test test/widget_test.dart test/dart_io_core_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
