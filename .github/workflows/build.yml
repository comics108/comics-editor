name: Build

# Проверочная сборка на всех платформах. Каждая платформа — независимая job без
# `needs` между ними, поэтому GitHub Actions запускает их параллельно, и падение
# одной job не отменяет и не блокирует остальные (это поведение по умолчанию для
# job-графа без зависимостей — им не нужен strategy.fail-fast, он относится
# только к matrix-стратегиям).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"
  DOTNET_VERSION: "10.0.x"

jobs:
  analyze:
    name: Analyze & fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # widget_test, dart_io_core_test, dataset_backward_compat_test — чистый
      # Dart, без внешних артефактов/платформенных бинарников. Последний
      # обычно skip'ается здесь же (dataset/ живёт только в monorepo, не в
      # этом отдельном git-репозитории apps/comics-editor-v2.9) — но явно
      # перечислен, чтобы это было видно в CI-выводе, а не только на macOS
      # job'е (см. build-macos: bare `flutter test` там подхватывает этот
      # файл тоже, но он теперь сам umеет skip'аться, не крашится).
      - run: flutter test test/widget_test.dart test/dart_io_core_test.dart test/dataset_backward_compat_test.dart test/document_open_coordinator_test.dart test/file_association_metadata_test.dart

  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: flutter pub get
      - run: dotnet build native/Comics.slnx -c Release
      - name: Publish headless core (win-x64)
        shell: bash
        run: tool/build_headless.sh win-x64
      - run: flutter build windows --release
      # Keep dotnet publish outside CMake/MSBuild custom commands. VS 2026's
      # MSBuild rejects both custom-target and POST_BUILD variants with
      # MSB1008 before publish_csharp.cmd starts. Publishing directly into the
      # packaged artifact also removes the need for a CMake copy step.
      - name: Publish C# editor bridge
        shell: cmd
        run: call windows\editor_plugin\publish_csharp.cmd build\windows\x64\runner\Release\dotnet
      - name: Test
        shell: bash
        run: flutter test test/widget_test.dart test/dart_io_core_test.dart test/core_client_test.dart test/document_open_coordinator_test.dart test/file_association_metadata_test.dart
      - name: Validate per-user file association (dry run)
        shell: pwsh
        run: windows/packaging/Register-ComicsFileAssociation.ps1 -ExecutablePath "${{ github.workspace }}\build\windows\x64\runner\Release\comics_editor.exe" -WhatIf
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
          retention-days: 14

  build-macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: flutter pub get
      - run: dotnet build native/Comics.slnx -c Release
      # NativeAOT-dylib нужен ffi_core_test (AOT-ворота для мобильного FFI-транспорта,
      # см. flows/sdd-comics-editor-v2.9-android-ios) — macOS host используется как
      # прогон для этой проверки, т.к. NativeAOT не кросс-компилируется между ОС.
      - run: tool/build_native.sh osx
      - name: Configure signing
        # Reuses the same Mac App Store distribution cert/profile secrets as
        # release-macos (macos/fastlane/Fastfile) — this job builds the same
        # Runner target with the same Release config, so it hits the same
        # "no Apple Development identity" failure Xcode's own project-format
        # auto-migration (`flutter build macos` upgrading project.pbxproj)
        # surfaces once a real DEVELOPMENT_TEAM is present. Unlike the
        # fastlane lane, this is a CI-only override appended to a local copy
        # of Release.xcconfig (never committed) — it does not touch
        # project.pbxproj or the checked-in Release.xcconfig, so the local
        # Xcode Archive/upload path this app was actually published through
        # is unaffected.
        env:
          MACOS_CERT_APP_P12_BASE64: ${{ secrets.MACOS_CERT_APP_P12_BASE64 }}
          MACOS_CERT_APP_PASSWORD: ${{ secrets.MACOS_CERT_APP_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERT_APP_P12_BASE64" ] || [ -z "$MACOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::MACOS_CERT_APP_P12_BASE64 / MACOS_PROVISIONING_PROFILE_BASE64 secret is not set — see macos/fastlane/Fastfile"
            exit 1
          fi
          echo "$MACOS_CERT_APP_P12_BASE64" | base64 --decode > macos_app.p12
          echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > macos_appstore.provisionprofile

          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" ci_signing.keychain
          security list-keychains -d user -s ci_signing.keychain $(security list-keychains -d user | sed 's/"//g')
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" ci_signing.keychain
          security set-keychain-settings -lut 3600 ci_signing.keychain
          security import macos_app.p12 -k ci_signing.keychain -P "$MACOS_CERT_APP_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGNING_KEYCHAIN_PASSWORD" ci_signing.keychain

          profile_uuid=$(security cms -D -i macos_appstore.provisionprofile | plutil -extract UUID raw -)
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          cp macos_appstore.provisionprofile "$profiles_dir/$profile_uuid.provisionprofile"

          app_identity=$(security find-identity -v -p codesigning ci_signing.keychain | grep '3rd Party Mac Developer Application' | head -1 | awk -F'"' '{print $2}')
          if [ -z "$app_identity" ]; then
            echo "::error::No '3rd Party Mac Developer Application' identity found in keychain after import"
            exit 1
          fi
          {
            echo "CODE_SIGN_STYLE = Manual"
            echo "CODE_SIGN_IDENTITY = $app_identity"
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "PROVISIONING_PROFILE_SPECIFIER = $profile_uuid"
          } >> macos/Runner/Configs/Release.xcconfig
      - run: flutter build macos --release
      - name: Embed headless core into the built app
        run: tool/build_headless.sh
      # Все 4 test-suite: widget, dart_io_core, core_client (process), ffi_core (AOT-ворота).
      - run: flutter test
      - name: Test macOS runner queue
        run: xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent comics_editor.app comics_editor-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/comics_editor-macos.zip
          retention-days: 14

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev desktop-file-utils libxml2-utils shared-mime-info
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: flutter pub get
      # Только Comics.Editor.Headless: Linux desktop не использует WPF/Windows-only
      # проекты решения, незачем собирать их и расширять поверхность отказа.
      - run: dotnet build native/Comics.Editor.Headless/Comics.Editor.Headless.csproj -c Release
      - run: flutter build linux --release
      - name: Embed headless core into the built bundle
        run: tool/build_headless.sh
      - run: flutter test test/widget_test.dart test/dart_io_core_test.dart test/core_client_test.dart test/document_open_coordinator_test.dart test/file_association_metadata_test.dart
      - name: Validate Linux file association metadata
        run: |
          bash -n linux/packaging/install-user.sh linux/packaging/uninstall-user.sh
          xmllint --noout linux/packaging/net.nativemind.comics.editor.xml
          test_root="$(mktemp -d)"
          cp /usr/bin/true "$test_root/Comics Editor"
          XDG_DATA_HOME="$test_root/data" linux/packaging/install-user.sh "$test_root/Comics Editor"
          test -f "$test_root/data/applications/net.nativemind.comics.editor.desktop"
          # desktop-file-validate requires a literal .desktop filename, so it
          # can't check the .desktop.in template directly -- validate the
          # rendered file install-user.sh just produced instead.
          desktop-file-validate "$test_root/data/applications/net.nativemind.comics.editor.desktop"
          XDG_DATA_HOME="$test_root/data" linux/packaging/uninstall-user.sh
          test ! -e "$test_root/data/applications/net.nativemind.comics.editor.desktop"
          test ! -e "$test_root/data/mime/packages/net.nativemind.comics.editor.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/*/release/bundle/
          retention-days: 14

  build-android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      # Android не использует .NET/NativeAOT-ядро: CoreCLR NativeAOT (ILCompiler)
      # не поддерживает linux-bionic/android RID в .NET 10 (исключены явно в
      # Microsoft.NETCoreSdk.BundledVersions.props — не вопрос кросс-компиляции
      # или NDK). Open/save реализованы на чистом Dart (DartIoCore), как и на iOS —
      # см. flows/sdd-comics-editor-v2.9-android-ios/04-implementation-log.md.
      - run: flutter build apk --release
      - working-directory: android
        run: ./gradlew testDebugUnitTest
      - run: flutter test test/widget_test.dart test/dart_io_core_test.dart test/document_open_coordinator_test.dart test/file_association_metadata_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  build-ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # iOS не использует .NET/NativeAOT-ядро: open/save реализованы на чистом Dart
      # (DartIoCore) — см. flows/sdd-comics-editor-v2.9-android-ios/01-requirements.md, Q1.
      - run: flutter build ios --release --no-codesign
      - run: flutter test test/widget_test.dart test/dart_io_core_test.dart test/document_open_coordinator_test.dart test/file_association_metadata_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
